# Publish / version tagging — structure aligned with tests.yml
# Creates refs/tags/<name> only when that tag is absent on origin (git ls-remote).
# publish-extension runs only when that job actually created and pushed a new tag.

# ══════════════════════════════════════════════════════════════════════════════
# METADATA
# ══════════════════════════════════════════════════════════════════════════════

name: Publish                               # Display name in the GitHub UI
run-name: Publish ${{ github.sha }}         # Dynamic run name
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false                 # Do not abort mid tag/push on rapid merges

# ══════════════════════════════════════════════════════════════════════════════
# WHEN? (Trigger events)
# ══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [ master ]                    # After merge (push to master)
  workflow_dispatch:                        # Manual trigger in the UI

# ══════════════════════════════════════════════════════════════════════════════
# SECURITY (Permissions)
# ══════════════════════════════════════════════════════════════════════════════

permissions:
  contents: read                            # Read repository contents (least privilege)

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

env:
  NODE_VERSION: '24'                        # Same as tests.yml; used by setup-node

# ══════════════════════════════════════════════════════════════════════════════
# JOBS (Work units)
# ══════════════════════════════════════════════════════════════════════════════

jobs:

  publish-tag-if-new-version:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write                       # Required to create git tags (refs/tags/*)

    outputs:
      tag_created: ${{ steps.create_version_tag.outputs.tag_created }}

    steps:

      - name: Ensure steps to avoid vulnerabilities
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # curl -s https://api.github.com/repos/step-security/harden-runner/commits/v2.22.1 | jq -r .sha
        with:
          egress-policy: audit

      - name: Setup the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # curl -s https://api.github.com/repos/actions/checkout/commits/v6.0.2 | jq -r .sha
        with:
          fetch-depth: 0                    # gitleaks uses a git rev range (e.g. push before..after); depth 1 often misses those commits
          fetch-tags: true                  # so local checks stay consistent; ls-remote still authoritative

      - name: Scan for secrets leaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # curl -s https://api.github.com/repos/gitleaks/gitleaks-action/commits/v2.3.9 | jq -r .sha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup NodeJS v${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # curl -s https://api.github.com/repos/actions/setup-node/commits/v6.4.0 | jq -r .sha
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create version tag if missing on github
        id: create_version_tag
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "${VERSION}" ]; then
            echo "::error::package.json is missing a non-empty \"version\" field"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
            echo "Tag ${VERSION} already exists on origin — skipping."
            echo "tag_created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/${VERSION}"
          echo "tag_created=true" >> "${GITHUB_OUTPUT}"

  publish-extension:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: publish-tag-if-new-version
    if: needs.publish-tag-if-new-version.outputs.tag_created == 'true'

    permissions:
      contents: write                       # Required to create the GitHub Release and upload the zip

    steps:

      - name: Ensure steps to avoid vulnerabilities
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # curl -s https://api.github.com/repos/step-security/harden-runner/commits/v2.22.1 | jq -r .sha
        with:
          egress-policy: audit

      - name: Setup the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # curl -s https://api.github.com/repos/actions/checkout/commits/v6.0.2 | jq -r .sha
        with:
          fetch-depth: 0                    # gitleaks uses a git rev range (e.g. push before..after); depth 1 often misses those commits

      - name: Scan for secrets leaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # curl -s https://api.github.com/repos/gitleaks/gitleaks-action/commits/v3.0.0 | jq -r .sha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup NodeJS v${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # curl -s https://api.github.com/repos/actions/setup-node/commits/v6.4.0 | jq -r .sha
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Attach the zip to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "${VERSION}" lib/build/*.zip --title "Release ${VERSION}" --notes "Release ${VERSION}"

      - name: Publish to the Chrome Web Store
        uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # curl -s https://api.github.com/repos/mnao305/chrome-extension-upload/commits/v7.0.0 | jq -r .sha
        with:
          file-path: lib/build/*.zip
          glob: true
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
