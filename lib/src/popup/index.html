<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sociétés LinkedIn</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1>Sociétés LinkedIn</h1>
      <p class="subtitle">Liste locale des sociétés suivies par indicateur de criticité.</p>
    </header>

    <section class="filters">
      <input
        id="search"
        type="search"
        placeholder="Rechercher par nom ou code…"
        autocomplete="off"
      />
      <select id="status-filter">
        <option value="">Tous les statuts</option>
      </select>
    </section>

    <section class="io-section" id="io-section">
      <div class="io-actions">
        <button type="button" id="export-btn" class="secondary">Exporter JSON</button>
        <button type="button" id="import-btn" class="secondary">Importer JSON</button>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
      <p class="io-hint">Ou déposez un fichier JSON ici.</p>
      <p id="io-message" class="io-message" hidden></p>
    </section>

    <section class="form-section">
      <h2 id="form-title">Ajouter une société</h2>
      <form id="company-form">
        <input type="hidden" id="edit-mode" value="add" />
        <label>
          Nom <span class="required">*</span>
          <input id="name" type="text" required placeholder="Ex. Capgemini" />
        </label>
        <label>
          Code LinkedIn <span class="required">*</span>
          <input
            id="linkedin-code"
            type="text"
            required
            placeholder="Ex. capgemini"
            pattern="[^\s]+"
            title="Slug utilisé dans l'URL /company/{code}/"
          />
        </label>
        <fieldset id="indicators" class="indicators"></fieldset>
        <label>
          Commentaire (facultatif)
          <textarea id="comment" rows="3" placeholder="Pourquoi ce statut ?"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" id="submit-btn">Ajouter</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>Annuler</button>
        </div>
      </form>
      <p id="form-error" class="error" hidden></p>
    </section>

    <section class="list-section">
      <h2>Sociétés enregistrées (<span id="count">0</span>)</h2>
      <ul id="company-list"></ul>
      <p id="empty-state" class="empty">Aucune société enregistrée.</p>
    </section>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
