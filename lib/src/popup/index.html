<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Companies Tracker</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1>LinkedIn Companies Tracker</h1>
      <p class="subtitle">Local list of tracked companies, grouped by criticity indicator.</p>
    </header>

    <section class="filters">
      <input
        id="search"
        type="search"
        placeholder="Search by name or code…"
        autocomplete="off"
      />
      <select id="status-filter">
        <option value="">All statuses</option>
      </select>
    </section>

    <section class="io-section" id="io-section">
      <div class="io-actions">
        <button type="button" id="export-btn" class="secondary">Export JSON</button>
        <button type="button" id="import-btn" class="secondary">Import JSON</button>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
      <p class="io-hint">Or drop a JSON file here.</p>
      <p id="io-message" class="io-message" hidden></p>
    </section>

    <section class="form-section">
      <h2 id="form-title">Add a company</h2>
      <form id="company-form">
        <input type="hidden" id="edit-mode" value="add" />
        <label>
          Name <span class="required">*</span>
          <input id="name" type="text" required placeholder="Ex. Capgemini" />
        </label>
        <label>
          LinkedIn code <span class="required">*</span>
          <input
            id="linkedin-code"
            type="text"
            required
            placeholder="Ex. capgemini"
            pattern="[^\s]+"
            title="Slug used in the URL /company/{code}/"
          />
        </label>
        <fieldset id="indicators" class="indicators"></fieldset>
        <label>
          Comment (optional)
          <textarea id="comment" rows="3" placeholder="Why this status?"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" id="submit-btn">Add</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>Cancel</button>
        </div>
      </form>
      <p id="form-error" class="error" hidden></p>
    </section>

    <section class="list-section">
      <h2>Saved companies (<span id="count">0</span>)</h2>
      <ul id="company-list"></ul>
      <p id="empty-state" class="empty">No companies saved.</p>
    </section>
  </body>
</html>
